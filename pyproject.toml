[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferchaos"
version = "0.1.0"
description = "Chaos engineering for LLM inference: inject GPU throttling, replica kills and traffic spikes, then measure SLO burn and recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/inferchaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
