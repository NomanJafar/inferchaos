[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferchaos"
version = "0.1.0"
description = "Chaos engineering for LLM inference: inject GPU throttling, replica kills and traffic spikes, then measure SLO burn and recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "tokenbench @ git+https://github.com/NomanJafar/tokenbench", "llmgateway @ git+https://github.com/NomanJafar/llmgateway", "uvicorn>=0.29"]
plots = ["matplotlib>=3.8"]

[project.scripts]
inferchaos = "inferchaos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferchaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
